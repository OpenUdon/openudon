name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-module:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Reject local module replacements
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' go.mod; then
            echo "public go.mod must not contain replace directives" >&2
            exit 1
          fi

      - name: Build iCoT standalone before tests
        run: GOWORK=off go build ./internal/icot ./cmd/icot

      - name: Download public dependencies
        run: GOWORK=off go mod download

      - name: Vet public module
        run: GOWORK=off go vet ./...

      - name: Test public module
        run: GOWORK=off go test ./... -count=1 -timeout=10m

      - name: Check repository boundary
        run: GOWORK=off go run ./cmd/openudon check-apitools-boundary

      - name: Check whitespace
        run: git diff --check

  release-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - darwin-amd64
          - darwin-arm64
          - windows-amd64
          - windows-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile public CLIs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          GOOS="${TARGET%-*}"
          GOARCH="${TARGET#*-}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi
          for COMMAND in openudon icot udon-runner; do
            GOWORK=off CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath \
                -o "/tmp/${COMMAND}-${TARGET}${EXT}" \
                "./cmd/${COMMAND}"
          done
