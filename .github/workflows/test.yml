name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-module:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Reject local module replacements
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' go.mod; then
            echo "public go.mod must not contain replace directives" >&2
            exit 1
          fi
      - name: Download public dependencies
        run: GOWORK=off go mod download
      - name: Build public module
        run: GOWORK=off go build ./...
      - name: Vet public module
        run: GOWORK=off go vet ./...
      - name: Test public module and import boundary
        run: GOWORK=off go test ./... -count=1 -timeout=10m
      - name: Check whitespace
        run: git diff --check
