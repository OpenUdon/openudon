name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify public module
        run: |
          if grep -Eq '^[[:space:]]*replace[[:space:]]' go.mod; then
            echo "public go.mod must not contain replace directives" >&2
            exit 1
          fi
          GOWORK=off go build ./cmd/openudon ./cmd/udon-runner
          GOWORK=off go mod download
          GOWORK=off go vet ./...
          GOWORK=off go test ./... -count=1 -timeout=10m
          GOWORK=off go run ./cmd/openudon check-apitools-boundary
          git diff --check

  browser-scenarios:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out OpenUdon
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up locked Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Require private Udon checkout credential
        env:
          GENELET_READ_TOKEN: ${{ secrets.GENELET_READ_TOKEN }}
        run: |
          if [ -z "$GENELET_READ_TOKEN" ]; then
            echo "::error::GENELET_READ_TOKEN must grant read-only contents access to the locked genelet executor closure"
            exit 1
          fi

      - name: Prepare the exact current browser and executor closure
        env:
          GENELET_READ_TOKEN: ${{ secrets.GENELET_READ_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          snapshot = root / "internal/browserscenario"
          current = json.loads((snapshot / "current-compatibility-lock-v5.json").read_text())
          closure = json.loads((snapshot / "current-qualification-build-inputs-v5.json").read_text())
          selected = {}
          for part in closure["components"] + current["components"]:
              name, revision = part["name"], part["commit"]
              if not re.fullmatch(r"[a-z][a-z0-9]*", name) or not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise SystemExit("invalid locked source identity")
              module = part.get("module", "github.com/genelet/udon" if name == "udon" else "github.com/OpenUdon/" + name)
              if module not in ("github.com/OpenUdon/" + name, "github.com/genelet/" + name):
                  raise SystemExit("invalid locked source repository")
              identity = (module, revision)
              if name in selected and selected[name] != identity:
                  raise SystemExit("conflicting browser/executor source locks")
              selected[name] = identity
          if len(closure["components"]) != 14 or len(selected) != 16:
              raise SystemExit("incomplete current executor closure")
          dependencies = root / "scenario-deps"
          dependencies.mkdir()
          token = os.environ["GENELET_READ_TOKEN"]
          if not token:
              raise SystemExit("missing private source read credential")
          authorization = base64.b64encode(("x-access-token:" + token).encode()).decode()
          environment = dict(os.environ, GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="/dev/null",
              GIT_CONFIG_COUNT="1", GIT_CONFIG_KEY_0="http.https://github.com/.extraheader",
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic " + authorization, GIT_TERMINAL_PROMPT="0")
          for name, (module, revision) in sorted(selected.items()):
              target = dependencies / name
              arguments = [["clone", "--quiet", "--no-checkout", "https://" + module + ".git", str(target)],
                           ["-C", str(target), "checkout", "--quiet", "--detach", revision]]
              try:
                  for args in arguments:
                      subprocess.run(["git", "-c", "core.hooksPath=/dev/null", "-c", "core.fsmonitor=false", *args],
                          env=environment, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                  actual = subprocess.check_output(["git", "-C", str(target), "rev-parse", "HEAD"], env=environment, text=True).strip()
                  dirty = subprocess.check_output(["git", "-C", str(target), "status", "--porcelain", "--untracked-files=all"], env=environment, text=True).strip()
                  if actual != revision or dirty:
                      raise SystemExit("locked source is not exact and clean")
              except subprocess.CalledProcessError:
                  raise SystemExit("locked source preparation failed; credential must read the full executor closure") from None
          PYTHON

      - name: Install locked Chromium runtimes
        run: |
          npm --prefix scenario-deps/browserdriver ci
          npx --prefix scenario-deps/browserdriver playwright install --with-deps chromium
          cd scenario-deps/browsertools
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.0 install --with-deps chromium

      - name: Enable Chromium sandbox user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
          fi
          if sysctl -n kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
            test "$(sysctl -n kernel.unprivileged_userns_clone)" = "1"
          fi

      - name: Run required neutral public capture qualification
        run: xvfb-run -a make browser-capture-check

      - name: Run required deterministic loopback suite
        run: |
          mkdir -p eval/runs/browser-scenario-release
          xvfb-run -a go run ./cmd/openudon browser-scenario-eval \
            --suite loopback \
            --stack current \
            --require-ready \
            --browsertools-repo scenario-deps/browsertools \
            --uws-repo scenario-deps/uws \
            --udon-repo scenario-deps/udon \
            --browserdriver-repo scenario-deps/browserdriver \
            --out eval/runs/browser-scenario-release/report.json
          go run ./cmd/openudon browser-scenario-eval \
            --verify eval/runs/browser-scenario-release/report.json

      - name: Run required realistic journey suite
        run: |
          mkdir -p eval/runs/browser-journey-release
          go run ./cmd/openudon browser-scenario-eval \
            --suite journey \
            --stack current \
            --require-ready \
            --browsertools-repo scenario-deps/browsertools \
            --uws-repo scenario-deps/uws \
            --udon-repo scenario-deps/udon \
            --browserdriver-repo scenario-deps/browserdriver \
            --out eval/runs/browser-journey-release/report.json
          go run ./cmd/openudon browser-scenario-eval \
            --verify eval/runs/browser-journey-release/report.json

      - name: Upload value-free scenario evidence
        uses: actions/upload-artifact@v7
        with:
          name: browser-scenario-loopback
          path: eval/runs/browser-scenario-release/report.json*
          if-no-files-found: error
          retention-days: 30

      - name: Upload value-free journey evidence
        uses: actions/upload-artifact@v7
        with:
          name: browser-scenario-journey
          path: eval/runs/browser-journey-release/report.json*
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [verify, browser-scenarios]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
            extension: ""
          - goos: linux
            goarch: arm64
            archive: tar.gz
            extension: ""
          - goos: darwin
            goarch: amd64
            archive: tar.gz
            extension: ""
          - goos: darwin
            goarch: arm64
            archive: tar.gz
            extension: ""
          - goos: windows
            goarch: amd64
            archive: zip
            extension: ".exe"
          - goos: windows
            goarch: arm64
            archive: zip
            extension: ".exe"

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="openudon_${VERSION}_${GOOS}_${GOARCH}"
          DEST="dist/${NAME}"
          mkdir -p "$DEST"
          GOWORK=off CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${DEST}/openudon${EXTENSION}" \
            ./cmd/openudon
          for COMMAND in udon-runner; do
            GOWORK=off CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${DEST}/${COMMAND}${EXTENSION}" \
              "./cmd/${COMMAND}"
          done
          cp LICENSE README.md "$DEST/"
          if [ "$GOOS" = "linux" ] && [ "$GOARCH" = "amd64" ]; then
            "${DEST}/openudon" version --json |
              grep -F "\"version\": \"${VERSION}\""
            DEMO_ROOT="${GITHUB_WORKSPACE}/.openudon-run/release-archive-smoke"
            "${DEST}/openudon" authoring draft \
              --from-example ./examples/eval/runtime-only-render \
              --example "${DEMO_ROOT}/package" \
              --no-llm \
              --yes
            "${DEST}/openudon" build --example "${DEMO_ROOT}/package"
            "${DEST}/openudon" assess --example "${DEMO_ROOT}/package"
            "${DEST}/openudon" approval-template \
              --example "${DEMO_ROOT}/package" \
              --state approved_for_sandbox \
              --reviewer "v0.1.0 archive smoke" \
              > "${DEMO_ROOT}/approval.json"
            "${DEST}/openudon" run \
              --example "${DEMO_ROOT}/package" \
              --tier sandbox \
              --approval "${DEMO_ROOT}/approval.json" \
              --workdir "${DEMO_ROOT}/run" \
              --dry-run
            "${DEST}/udon-runner" --help
          fi
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist && zip -qr "${NAME}.zip" "${NAME}")
          else
            tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: openudon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/openudon_*.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum openudon_* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
